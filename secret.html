<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>ห้องลับ</title>
</head>
<body style="text-align: center; padding-top: 50px; font-family: sans-serif;">

  <div id="content">กำลังตรวจสอบสิทธิ์...</div>

  <script>
    // วาง URL ของ Vercel ตรงนี้ (ไม่ต้องใส่ / ปิดท้าย)
    const BACKEND_URL = 'https://vercel.com/me2-1322/my-vercel-backend.app';

    const urlParams = new URLSearchParams(window.location.search);
    const ticket = urlParams.get('ticket');

    fetch(`${BACKEND_URL}/api/get-secret?ticket=${ticket}`)
      .then(res => {
        if (!res.ok) throw new Error('Unauthorized');
        return res.json();
      })
      .then(data => {
        // เมื่อหลังบ้านอนุมัติ นำเนื้อหาลับมาแสดง
        document.getElementById('content').innerHTML = data.htmlContent;
      })
      .catch(err => {
        // ถ้าไม่มีตั๋วหรือตั๋วหมดอายุ ให้เด้งกลับไปหน้าเกม
        alert('คุณไม่มีสิทธิ์เข้าหน้านี้ หรือตั๋วหมดอายุแล้ว');
        window.location.href = 'game.html';
      });
  </script>
</body>
</html>
